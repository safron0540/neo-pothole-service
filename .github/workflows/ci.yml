name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Токен только на чтение: CI ничего не пишет в репозиторий
permissions:
  contents: read

# Новый пуш в тот же PR отменяет старый запуск; запуски на main не отменяются
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Значения для CI: настоящих секретов здесь нет
env:
  DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/potholes
  JWT_SECRET: ci-only-secret
  JWT_ACCESS_MINUTES: '30'
  JWT_REFRESH_DAYS: '14'
  PHOTOS_DIR: /tmp/photos
  ML_URL: http://localhost:8001
  ML_TIMEOUT_SECONDS: '8'

jobs:
  # 1. Backend: стиль и быстрые тесты (без базы)
  backend-ci:
    name: Backend (Ruff & unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint and unit tests
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            if [ -f requirements-dev.txt ]; then
              pip install -r requirements-dev.txt
            else
              pip install ruff pytest pytest-cov
            fi
            ruff check .
            ruff format --check .
            if [ -d tests ]; then
              # код 5 = «тестов не найдено»: допустимо, пока тестов нет
              pytest -m "not integration and not e2e and not slow" || [ $? -eq 5 ]
            fi
          else
            echo "requirements.txt not found in ./backend. Skipping."
          fi

  # 2. Backend: миграции и тесты с PostGIS
  backend-integration:
    name: Backend (PostGIS, migrations, integration tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./backend
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: potholes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d potholes"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Migrations and integration tests
        run: |
          if [ -f requirements.txt ] && [ -f alembic.ini ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            if [ -f requirements-dev.txt ]; then
              pip install -r requirements-dev.txt
            else
              pip install pytest
            fi
            alembic upgrade head
            alembic check
            # проверка отката последней миграции: схема должна подниматься заново
            alembic downgrade -1
            alembic upgrade head
            pytest --cov=app --cov-report=term-missing --cov-fail-under=60 || [ $? -eq 5 ]
          else
            echo "requirements.txt or alembic.ini not found in ./backend. Skipping."
          fi

  # 3. Образы Docker: backend и ML-сервис собираются
  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          for svc in backend ml_service; do
            if [ -f "$svc/Dockerfile" ]; then
              docker build -t "potholes-$svc" "$svc"
            else
              echo "$svc/Dockerfile not found. Skipping."
            fi
          done

  # 4. Веб-клиент
  frontend-ci:
    name: Frontend (ESLint & Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run linting and build
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
            npm run lint --if-present
            npm run build --if-present
          else
            echo "package.json not found in ./frontend. Skipping."
          fi

  # 5. ML-сервис
  ml-ci:
    name: ML Service (Ruff & tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./ml_service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run linting and tests
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install ruff pytest
            ruff check .
            if [ -d tests ]; then
              pytest || [ $? -eq 5 ]
            fi
          else
            echo "requirements.txt not found in ./ml_service. Skipping."
          fi

  # 6. Мобильное приложение: быстрая проверка бандла Expo (без тяжелой сборки APK)
  mobile-ci:
    name: Mobile Android (Expo bundle check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ./mobile
    env:
      EXPO_PUBLIC_API_URL: https://pothole.safronspace.ru/api/v1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo bundle export
        run: npx expo export --platform android

  # 7. Сквозные smoke-автотесты (синтаксис и сборка набора)
  smoke-ci:
    name: Smoke tests syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify smoke tests collection
        run: |
          if [ -d tests/smoke ]; then
            python -m pip install --upgrade pip
            pip install -r tests/smoke/requirements.txt
            pytest tests/smoke --collect-only
          else
            echo "tests/smoke not found. Skipping."
          fi

  # 8. Единый итог: в защите ветки main достаточно требовать только эту проверку
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [backend-ci, backend-integration, docker-build, frontend-ci, ml-ci, mobile-ci, smoke-ci]
    if: always()
    steps:
      - name: Check results
        run: |
          echo '${{ toJSON(needs) }}'
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more jobs failed or were cancelled."
            exit 1
          fi

  # 9. Деплой на сервер: только после слияния в main и зелёного ci-gate
  deploy:
    name: Deploy to Server (CD)
    runs-on: ubuntu-latest
    needs: [ci-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /workspace
            git pull --ff-only origin main

            # Сборка веб-демо мобильного приложения для стенда (/demo/)
            if [ -d mobile ] && [ -f mobile/package.json ]; then
              echo "Сборка веб-демо мобильного приложения..."
              (cd /workspace/mobile && (npm ci --prefer-offline --no-audit --no-fund || npm install))
              (cd /workspace/mobile && npx expo export --platform web --output-dir ../infra/mobile-demo/app)
              sed -i 's|src="/_expo/|src="./_expo/|g' /workspace/infra/mobile-demo/app/index.html 2>/dev/null || true
              sed -i 's|href="/favicon|href="./favicon|g' /workspace/infra/mobile-demo/app/index.html 2>/dev/null || true
            fi

            if [ -f deploy.sh ]; then
              bash deploy.sh
            else
              echo "deploy.sh not found in /workspace. Nothing to deploy."
              exit 0
            fi

            # Дальше шаги, которых нет в серверном deploy.sh
            [ -f docker-compose.yml ] || exit 0

            # Миграции: только если backend уже собран с Alembic
            if docker compose exec -T backend test -f alembic.ini 2>/dev/null; then
              docker compose exec -T backend alembic upgrade head
            fi

            # Проверка /api/v1/health (порт из .env, по умолчанию 8000)
            port="$( { grep -E '^BACKEND_PORT=' .env 2>/dev/null || true; } | tail -n1 | cut -d= -f2 )"
            url="http://localhost:${port:-8000}/api/v1/health"
            ok=0
            for _ in $(seq 1 15); do
              if curl -fsS "$url" > /dev/null; then ok=1; break; fi
              sleep 4
            done
            docker compose ps
            if [ "$ok" -ne 1 ]; then
              docker compose logs --tail=50 backend || true
              echo "Health check failed: $url"
              exit 1
            fi

            # Пост-деплой smoke-проверка
            if [ -d tests/smoke ] && [ -f tests/smoke/requirements.txt ]; then
              echo "Запуск smoke-автотестов на стенде..."
              python3 -m pip install -q -r tests/smoke/requirements.txt 2>/dev/null || true
              BASE_URL="http://127.0.0.1:${port:-8000}" python3 -m pytest tests/smoke -v || true
            fi

            docker image prune -f > /dev/null
