name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-ci:
    name: Backend (Ruff & Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run linting and unit tests
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install ruff pytest pytest-cov
            ruff check .
            ruff format --check .
            if [ -d tests ]; then
              pytest -m "not integration and not e2e and not slow" --cov=app/core --cov=app/services --cov-report=term-missing --cov-fail-under=60
            fi
          else
            echo "requirements.txt not found in ./backend. Skipping."
          fi

  frontend-ci:
    name: Frontend (ESLint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run linting and build
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
            npm run lint || true
            npm run build || true
          else
            echo "package.json not found in ./frontend. Skipping."
          fi

  ml-ci:
    name: ML Service (Ruff Linting)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ml_service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run linting
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install ruff pytest
            ruff check .
          else
            echo "requirements.txt not found in ./ml_service. Skipping."
          fi

  mobile-ci:
    name: Mobile Android (Ktlint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run checks and build
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew lint || true
            ./gradlew assembleDebug
          else
            echo "gradlew not found in ./mobile. Skipping."
          fi

  deploy:
    name: Deploy to Server (CD)
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci, ml-ci, mobile-ci]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /workspace
            git pull origin main || true
            if [ -f deploy.sh ]; then
              chmod +x deploy.sh
              ./deploy.sh
            elif [ -f docker-compose.yml ]; then
              docker compose up -d --build
            else
              echo "No deploy.sh or docker-compose.yml found in /workspace."
            fi
