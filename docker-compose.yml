# Локальный и серверный запуск: docker compose up -d --build
# Настройки берутся из .env в корне (шаблон: .env.example).
# Сервис API называется backend: так его ищут шаги деплоя в ci.yml.

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-potholes}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Только localhost: база не видна снаружи, но доступна тестам с машины разработчика
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Внутри сети compose база доступна по имени сервиса db
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-potholes}
      ML_URL: http://ml_service:8001
    depends_on:
      db:
        condition: service_healthy
    # Фото «до» и «после» переживают пересборку контейнера (PHOTOS_DIR)
    volumes:
      - photos:/data/photos
      # Ключ Firebase для push (FCM_CREDENTIALS_FILE); папки нет — push выключен
      - ./secrets:/run/secrets:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  # Пока заглушка (ML_STUB_MODE в .env); настоящую модель ведёт ML-разработчик
  ml_service:
    build: ./ml_service
    restart: unless-stopped
    environment:
      ML_STUB_MODE: ${ML_STUB_MODE:-random}
    ports:
      - "127.0.0.1:${ML_PORT:-8001}:8001"

volumes:
  pgdata:
  photos:
