# nginx перед API и вебом (фаза 6-1). Порт 80 хоста занят Caddy (HTTPS, safronspace.ru),
# поэтому compose публикует nginx на 127.0.0.1:${NGINX_PORT:-8080}, а Caddy проксирует сюда.
# TLS заканчивается на Caddy.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    server_tokens off;
    sendfile on;

    # Настоящий IP клиента: Caddy передаёт его в X-Forwarded-For, а к nginx приходит
    # из сети Docker. Без этого limit_req считал бы всех одним клиентом
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # В логах нет query: в ссылке на фото подпись, в некоторых запросах телефон (правило 7)
    log_format main '$remote_addr [$time_local] "$request_method $uri" $status '
                    '$body_bytes_sent $request_time';
    access_log /var/log/nginx/access.log main;

    # Вход и регистрация: 10 попыток в минуту с одного IP (БЗ-2); остальной API — 20 в секунду
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_status 429;

    # Дисковый кэш для тайлов карты (до 2 ГБ, 30 дней)
    proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles_cache:10m max_size=2g inactive=30d use_temp_path=off;

    # DNS Docker: после пересоздания контейнера backend его IP меняется, nginx узнаёт новый
    # сам (resolve), иначе после деплоя отвечал бы 502 до своего перезапуска
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream backend {
        zone backend 64k;
        server backend:8000 resolve;
        keepalive 16;
    }

    server {
        listen 80;
        client_max_body_size 11m;  # фото до 10 МБ (В-21) плюс поля формы

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;  # автообработка ≤ 30 с (ПР-5)

        location ~ ^/api/v1/auth/(staff/login|citizen/login|citizen/register|refresh)$ {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://backend;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://backend;
        }

        # Метрики только для Prometheus внутри сети compose, снаружи — 404
        location = /metrics {
            return 404;
        }

        # Фото отдаёт nginx: бэкенд проверил подпись и ответил X-Accel-Redirect
        location /_photos/ {
            internal;
            alias /data/photos/;
            add_header Cache-Control "private, max-age=900";
        }

        # Ошибка 429 в формате API: {code, message, details}
        error_page 429 = @too_many;
        location @too_many {
            default_type application/json;
            return 429 '{"code":"too_many_requests","message":"Слишком много запросов, подождите минуту","details":null}';
        }

        # Кэширующий прокси тайлов карты (OpenStreetMap Germany mirror)
        location ~ ^/tiles/(\d+)/(\d+)/(\d+)\.png$ {
            proxy_cache tiles_cache;
            # Успешные тайлы держим в кэше сервера 30 дней
            proxy_cache_valid 200 304 30d;
            # Любые ошибки сервера или сети НЕ кэшируем (0 секунд)
            proxy_cache_valid 400 403 404 500 502 503 504 0s;
            proxy_cache_key "$1/$2/$3";
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            # Успешные тайлы браузер кэширует на 7 дней с мягким фоновым обновлением (SWR)
            add_header X-Cache-Status $upstream_cache_status;
            add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";

            # Маскируем запросы от имени нашего проекта
            proxy_set_header User-Agent "PotholeService/1.0 (Tomsk Road Maintenance Project)";
            proxy_set_header Referer "https://pothole.safronspace.ru/";

            # Надежное зеркало OpenStreetMap без водяных знаков и ключей
            proxy_pass https://tile.openstreetmap.de/$1/$2/$3.png;

            proxy_ssl_server_name on;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # Веб-панель: собранный frontend/dist; маршрутизация через #, поэтому всё — в index.html
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
