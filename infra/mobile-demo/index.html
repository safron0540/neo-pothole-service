<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEO-СЕРВИС</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0b0f19;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Только чистый контур телефона */
    .phone-wrapper {
      position: relative;
      width: 390px;
      height: 844px;
      max-height: 94vh;
      background: #000;
      border-radius: 48px;
      padding: 10px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9),
                  0 0 0 2px #334155,
                  0 0 0 5px #1e293b;
      display: flex;
      flex-direction: column;
    }

    .phone-screen {
      position: relative;
      width: 100%;
      height: 100%;
      background: #fff;
      border-radius: 38px;
      overflow: hidden;
    }

    /* Iframe с реальным приложением из mobile/ */
    .app-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #fff;
      display: block;
    }

    /* На реальном телефоне - чистый экран без рамки */
    @media (max-width: 600px) {
      body {
        background: #fff;
      }

      .phone-wrapper {
        width: 100vw;
        height: 100vh;
        max-height: 100vh;
        border-radius: 0;
        padding: 0;
        box-shadow: none;
        background: transparent;
      }

      .phone-screen {
        border-radius: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Только чистая окантовка телефона -->
  <div class="phone-wrapper">
    <div class="phone-screen">
      <iframe id="app-frame" class="app-frame" src="./app/index.html"></iframe>
    </div>
  </div>

</body>
</html>
